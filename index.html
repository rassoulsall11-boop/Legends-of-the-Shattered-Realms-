<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON VORTEX</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
/* ... (Tes styles CSS restent exactement les mêmes) ... */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
:root{--cy:#00f3ff;--re:#ff0055;--or:#ff9800;--gr:#00ff88;--pu:#bf00ff;--ye:#ffe600;--bg:#020408;--f:'Orbitron',sans-serif;--ui-xs:clamp(.48rem,1.4vw,.58rem);--ui-sm:clamp(.55rem,1.6vw,.68rem);--ui-md:clamp(.68rem,2vw,.85rem);--ui-lg:clamp(.85rem,2.4vw,1.1rem);}
*{box-sizing:border-box;user-select:none;touch-action:none;margin:0;padding:0;}
body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f);}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
#loader{position:fixed;inset:0;z-index:9999;background:#020408;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .6s ease;}
#loader.fade-out{opacity:0;pointer-events:none;}
#loader-logo{font-size:clamp(2.2rem,7vw,4rem);font-weight:900;letter-spacing:.15em;background:linear-gradient(135deg,var(--cy),var(--pu));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#loader-bar-wrap{width:min(280px,60vw);height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
#loader-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--cy),var(--pu));}
.ov{position:absolute;inset:0;background:rgba(2,4,8,.93);backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:12px;}
.hidden{display:none!important;}
.mb{padding:14px 16px;background:rgba(0,243,255,.06);border:1px solid rgba(0,243,255,.3);color:#fff;cursor:pointer;font-family:var(--f);border-radius:9px;}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:15px;display:flex;justify-content:space-between;z-index:100;}
.hbox{background:rgba(0,243,255,.05);border:1px solid rgba(0,243,255,.15);border-radius:10px;padding:8px;color:#fff;}
#bhud{position:absolute;bottom:0;left:0;width:100%;padding:15px;display:flex;justify-content:space-between;z-index:100;}
.bar{width:120px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.bf{height:100%;transition:width .3s;}
</style>
</head>
<body>

<div id="loader"><div id="loader-logo">NEON VORTEX</div><div id="loader-bar-wrap"><div id="loader-bar"></div></div><div id="loader-pct">0%</div></div>
<div id="hud">
    <div class="hbox"><div id="sc" style="font-size:1.5rem;font-weight:900;color:var(--cy)">0</div></div>
    <div class="hbox">⬡ <span id="coin-hud">0</span></div>
</div>
<div id="bhud">
    <div class="bar"><div class="bf" id="hpf" style="width:100%;background:var(--re)"></div></div>
    <div class="bar"><div class="bf" id="shf" style="width:0%;background:var(--cy)"></div></div>
</div>
<div class="ov" id="menu">
    <h1 style="color:var(--cy)">NEON VORTEX</h1>
    <p style="color:#fff">RECORD: <span id="bs">0</span></p>
    <button class="mb" id="btn-play">▶ JOUER</button>
</div>
<canvas id="canvas"></canvas>

<script>
const NV = (() => {
    const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');
    let W, H, lastT = 0, spawnT = 0;
    const G = { state:'MENU', sc:0, hp:3, mHp:3, coins:0, slowMo:0, ents:[], stars:[], pl:{x:0,y:0,tx:0,ty:0,r:15} };

    const resize = () => { W=cvs.width=window.innerWidth; H=cvs.height=window.innerHeight; };
    window.onload = () => {
        resize(); window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { G.pl.tx=e.clientX; G.pl.ty=e.clientY; });
        window.addEventListener('touchmove', e => { G.pl.tx=e.touches[0].clientX; G.pl.ty=e.touches[0].clientY; });
        document.getElementById('btn-play').onclick = start;
        for(let i=0;i<50;i++) G.stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+1});
        // Loader rapide
        let p=0; const li=setInterval(()=>{ p+=5; document.getElementById('loader-bar').style.width=p+'%'; if(p>=100){clearInterval(li);document.getElementById('loader').classList.add('fade-out');}}, 30);
        requestAnimationFrame(loop);
    };

    function start() { 
        G.state='PLAY'; G.sc=0; G.hp=3; G.ents=[]; G.coins=0; 
        document.getElementById('menu').classList.add('hidden'); 
    }

    function loop(t) {
        const dt = t - lastT; lastT = t;
        ctx.fillStyle='#020408'; ctx.fillRect(0,0,W,H);
        
        // Stars
        G.stars.forEach(s => { 
            s.y += s.s; if(s.y>H) s.y=0; 
            ctx.fillStyle='#fff'; ctx.fillRect(s.x, s.y, 1, 1);
        });

        if(G.state==='PLAY') {
            G.pl.x += (G.pl.tx-G.pl.x)*0.2; G.pl.y += (G.pl.ty-G.pl.y)*0.2;
            
            // Spawn Ennemis
            if(t > spawnT) {
                G.ents.push({x:Math.random()*W, y:-20, r:15+Math.random()*10, s:3+Math.random()*3, type:Math.random()>0.9?'GOLD':'EN'});
                spawnT = t + 600;
            }

            // Update Entités
            G.ents.forEach((e, i) => {
                e.y += e.s;
                const dist = Math.hypot(e.x-G.pl.x, e.y-G.pl.y);
                if(dist < e.r + G.pl.r) {
                    if(e.type==='GOLD') { G.coins+=10; document.getElementById('coin-hud').innerText=G.coins; }
                    else { G.hp--; document.getElementById('hpf').style.width=(G.hp/3*100)+'%'; if(G.hp<=0) { G.state='MENU'; document.getElementById('menu').classList.remove('hidden'); } }
                    G.ents.splice(i, 1);
                }
                ctx.fillStyle = e.type==='GOLD' ? '#ffe600' : '#ff0055';
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
            });

            // Player
            ctx.fillStyle='#00f3ff'; ctx.beginPath(); ctx.arc(G.pl.x, G.pl.y, G.pl.r, 0, Math.PI*2); ctx.fill();
            G.sc += 0.1; document.getElementById('sc').innerText = Math.floor(G.sc);
        }
        requestAnimationFrame(loop);
    }
})();
</script>
</body>
</html>
